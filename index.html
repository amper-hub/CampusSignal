<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusSignal - API Test Frontend</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .content {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .card h2 {
      color: #667eea;
      margin-bottom: 15px;
      font-size: 1.3rem;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 0.9rem;
      font-family: inherit;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 5px;
    }

    button:hover {
      background: #764ba2;
    }

    button:active {
      transform: scale(0.98);
    }

    button.secondary {
      background: #6c757d;
    }

    button.secondary:hover {
      background: #5a6268;
    }

    button.danger {
      background: #dc3545;
    }

    button.danger:hover {
      background: #c82333;
    }

    .token-status {
      background: #f8f9fa;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 0.85rem;
      color: #666;
    }

    .token-status.active {
      background: #d4edda;
      color: #155724;
      border-left: 3px solid #28a745;
    }

    .output-section {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .output-section h2 {
      color: #667eea;
      margin-bottom: 15px;
      font-size: 1.3rem;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    #output {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      padding: 15px;
      min-height: 150px;
      max-height: 400px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      color: #333;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty-state {
      color: #999;
      font-style: italic;
    }

    .success {
      color: #28a745;
    }

    .error {
      color: #dc3545;
    }

    .info {
      color: #667eea;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.8rem;
      }

      .content {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <h1>🎓 CampusSignal</h1>
      <p class="subtitle">Backend API Test Client • http://localhost:3000</p>
    </header>

    <!-- Main Content: Forms -->
    <div class="content">
      <!-- ============ REGISTER FORM ============ -->
      <div class="card">
        <h2>Register</h2>
        <div class="token-status" id="registerStatus"></div>
        <form id="registerForm">
          <div class="form-group">
            <label for="regName">Name</label>
            <input type="text" id="regName" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" placeholder="john@example.com" required>
          </div>
          <div class="form-group">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" placeholder="••••••••" required>
          </div>
          <button type="submit">Register</button>
        </form>
      </div>

      <!-- ============ LOGIN FORM ============ -->
      <div class="card">
        <h2>Login</h2>
        <div class="token-status" id="loginStatus"></div>
        <form id="loginForm">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" placeholder="john@example.com" required>
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
          </div>
          <button type="submit">Login</button>
          <button type="button" class="secondary" onclick="logoutUser()">Logout</button>
        </form>
      </div>

      <!-- ============ CREATE ISSUE FORM ============ -->
      <div class="card">
        <h2>Create Issue</h2>
        <div class="token-status" id="issueStatus"></div>
        <form id="issueForm">
          <div class="form-group">
            <label for="issueTitle">Title</label>
            <input type="text" id="issueTitle" placeholder="Library WiFi too slow" required>
          </div>
          <div class="form-group">
            <label for="issueDescription">Description</label>
            <textarea id="issueDescription" placeholder="Describe the issue..." required></textarea>
          </div>
          <div class="form-group">
            <label for="issueCategory">Category</label>
            <select id="issueCategory" required>
              <option value="">-- Select --</option>
              <option value="facility">Facility</option>
              <option value="academic">Academic</option>
              <option value="safety">Safety</option>
              <option value="other">Other</option>
            </select>
          </div>
          <button type="submit">Create Issue</button>
        </form>
      </div>

      <!-- ============ LIST & VOTE SECTION ============ -->
      <div class="card">
        <h2>Issues & Voting</h2>
        <div class="token-status" id="actionStatus"></div>
        <div class="form-group">
          <label>Actions</label>
          <button onclick="listAllIssues()">📋 List All Issues</button>
        </div>
        <div class="form-group">
          <label for="voteIssueId">Issue ID to vote on:</label>
          <input type="text" id="voteIssueId" placeholder="e.g., 1, 2, 3...">
        </div>
        <button onclick="voteOnIssue()" class="secondary">👍 Vote (Agree)</button>
      </div>
    </div>

    <!-- ============ OUTPUT / RESPONSE SECTION ============ -->
    <div class="output-section">
      <h2>API Response Log</h2>
      <div id="output" class="empty-state">Waiting for API calls...</div>
    </div>
  </div>

  <script>
    // ========== CONFIGURATION ==========
    const API_BASE_URL = 'http://localhost:3000';
    const TOKEN_KEY = 'campus_signal_jwt';

    // ========== UTILITY FUNCTIONS ==========

    /**
     * Display output in the response log
     */
    function displayOutput(message, type = 'info') {
      const output = document.getElementById('output');
      const timestamp = new Date().toLocaleTimeString();
      const colorClass = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
      const prefix = type === 'success' ? '✓' : type === 'error' ? '✗' : 'ℹ';

      output.innerHTML = `<span class="${colorClass}">[${timestamp}] ${prefix} ${message}</span>\n\n${output.innerHTML}`;
    }

    /**
     * Store JWT token in localStorage
     */
    function setToken(token) {
      localStorage.setItem(TOKEN_KEY, token);
      updateTokenStatus();
    }

    /**
     * Get JWT token from localStorage
     */
    function getToken() {
      return localStorage.getItem(TOKEN_KEY);
    }

    /**
     * Check if user is authenticated
     */
    function isAuthenticated() {
      return !!getToken();
    }

    /**
     * Remove JWT token (logout)
     */
    function clearToken() {
      localStorage.removeItem(TOKEN_KEY);
      updateTokenStatus();
    }

    /**
     * Update token status display across all forms
     */
    function updateTokenStatus() {
      const token = getToken();
      const statusElements = ['registerStatus', 'loginStatus', 'issueStatus', 'actionStatus'];

      statusElements.forEach(id => {
        const el = document.getElementById(id);
        if (token) {
          el.className = 'token-status active';
          el.textContent = `✓ Logged in (Token: ${token.substring(0, 20)}...)`;
        } else {
          el.className = 'token-status';
          el.textContent = '○ Not authenticated. Login to proceed.';
        }
      });
    }

    /**
     * Generic fetch wrapper with JWT authorization
     */
    async function apiCall(endpoint, method = 'GET', body = null) {
      const headers = {
        'Content-Type': 'application/json',
      };

      // Attach JWT token if available
      const token = getToken();
      if (token) {
        headers['Authorization'] = `Bearer ${token}`;
      }

      const options = {
        method,
        headers,
      };

      if (body) {
        options.body = JSON.stringify(body);
      }

      try {
        const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
        const data = await response.json();

        // Log the full response for debugging
        const responseText = `${method} ${endpoint}\nStatus: ${response.status}\n${JSON.stringify(data, null, 2)}`;
        displayOutput(responseText, response.ok ? 'success' : 'error');

        if (!response.ok) {
          displayOutput(`Error: ${data.message || 'Request failed'}`, 'error');
          return null;
        }

        return data;
      } catch (err) {
        displayOutput(`Network Error: ${err.message}`, 'error');
        return null;
      }
    }

    // ========== AUTH FUNCTIONS ==========

    /**
     * Handle user registration
     */
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;

      displayOutput(`Registering user: ${email}...`);

      const result = await apiCall('/auth/register', 'POST', {
        name,
        email,
        password,
      });

      if (result) {
        displayOutput(`Registration successful for ${email}`, 'success');
        document.getElementById('registerForm').reset();
      }
    });

    /**
     * Handle user login
     */
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      displayOutput(`Logging in as: ${email}...`);

      const result = await apiCall('/auth/login', 'POST', {
        email,
        password,
      });

      if (result && result.access_token) {
        setToken(result.access_token);
        displayOutput(`Login successful! Token stored.`, 'success');
        document.getElementById('loginForm').reset();
      }
    });

    /**
     * Handle logout
     */
    function logoutUser() {
      clearToken();
      displayOutput('Logged out. Token cleared.', 'info');
    }

    // ========== ISSUE FUNCTIONS ==========

    /**
     * Handle creating a new issue
     */
    document.getElementById('issueForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!isAuthenticated()) {
        displayOutput('Error: You must be logged in to create an issue.', 'error');
        return;
      }

      const title = document.getElementById('issueTitle').value;
      const description = document.getElementById('issueDescription').value;
      const category = document.getElementById('issueCategory').value;

      displayOutput(`Creating issue: "${title}"...`);

      const result = await apiCall('/issues', 'POST', {
        title,
        description,
        category,
      });

      if (result) {
        displayOutput(`Issue created successfully!`, 'success');
        document.getElementById('issueForm').reset();
      }
    });

    /**
     * List all issues
     */
    async function listAllIssues() {
      displayOutput(`Fetching all issues...`);

      const result = await apiCall('/issues', 'GET');

      if (result) {
        displayOutput(`Found ${result.length || 0} issues:\n${JSON.stringify(result, null, 2)}`, 'success');
      }
    }

    // ========== VOTING FUNCTIONS ==========

    /**
     * Vote on an issue
     */
    async function voteOnIssue() {
      if (!isAuthenticated()) {
        displayOutput('Error: You must be logged in to vote.', 'error');
        return;
      }

      const issueId = document.getElementById('voteIssueId').value;

      if (!issueId) {
        displayOutput('Error: Please enter an Issue ID.', 'error');
        return;
      }

      displayOutput(`Voting on issue ${issueId}...`);

      const result = await apiCall('/votes', 'POST', {
        issueId,
        voteType: 'upvote',
      });

      if (result) {
        displayOutput(`Vote submitted successfully!`, 'success');
        document.getElementById('voteIssueId').value = '';
      }
    }

    // ========== INITIALIZATION ==========

    // Check token status on page load
    updateTokenStatus();
    displayOutput('Frontend loaded. Ready to test API endpoints.', 'info');
  </script>
</body>
</html>
