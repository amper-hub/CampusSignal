<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusSignal | Sign In</title>
    <link rel="stylesheet" href="/ui/theme.css" />
  </head>
  <body>
    <main class="auth-layout">
      <section class="auth-hero">
        <div class="logo">CampusSignal</div>
        <p class="tagline">Your campus.<br />Your voice.<br />Heard.</p>
      </section>
      <section class="auth-form-wrap">
        <div class="panel">
          <h1>Sign in</h1>
          <form id="loginForm">
            <div class="field">
              <label for="email">Email</label>
              <input id="email" type="email" required />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" type="password" required />
            </div>
            <button class="btn-primary" type="submit">Sign In</button>
            <p id="error" class="error-text"></p>
          </form>
          <p class="muted">New here? <a class="link" href="/ui/register.html">Sign up free</a></p>
        </div>
      </section>
    </main>

    <script src="/api.js"></script>
    <script>
      document.getElementById("loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const errorEl = document.getElementById("error");
        errorEl.textContent = "";
        try {
          const response = await API.auth.login(
            document.getElementById("email").value,
            document.getElementById("password").value,  
          );
          
          // DEBUG: Log the login response
          console.log('[LOGIN] Response:', response);
          console.log('[LOGIN] User:', response.user);
          console.log('[LOGIN] Role:', response.user?.role);
          
          // Store in localStorage
          localStorage.setItem("token", response.access_token);
          localStorage.setItem("user", JSON.stringify(response.user));
          localStorage.setItem("role", response.user?.role || "user");
          
          console.log('[LOGIN] Stored role:', localStorage.getItem("role"));
          
          // Redirect based on role
          const role = response.user?.role;
          console.log('[LOGIN] Final role check:', role);
          
          if (role === "admin") {
            console.log('[LOGIN] Admin detected - redirecting to admin-dashboard.html');
            window.location.href = "/ui/admin-dashboard.html";
            return;
          }
          
          console.log('[LOGIN] Regular user detected - redirecting to home.html');
          window.location.href = "/ui/home.html";
        } catch (error) {
          console.error('[LOGIN] Error:', error);
          errorEl.textContent = error.message || "Login failed";
        }
      });
    </script>
  </body>
</html>
